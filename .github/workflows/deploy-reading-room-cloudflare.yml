name: Deploy reading room MCP Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-room-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out verified main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Check deployment prerequisites
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "Missing D1_DATABASE_ID repository secret"; exit 1; }
          if ! [[ "$D1_DATABASE_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "D1_DATABASE_ID must be a Cloudflare D1 UUID"; exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        run: |
          pnpm typecheck
          pnpm build
      - name: Inject private D1 binding into runner-only config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          node -e 'const fs=require("node:fs");const f="server/wrangler.jsonc";const s=fs.readFileSync(f,"utf8");if(!s.includes("REPLACE_WITH_YOUR_D1_DATABASE_ID"))throw Error("Unexpected D1 config; refusing deployment");fs.writeFileSync(f,s.replace("REPLACE_WITH_YOUR_D1_DATABASE_ID",process.env.D1_DATABASE_ID));'
      - name: Wrangler dry-run
        working-directory: server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy MCP Worker
        working-directory: server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
